<div class="sp-fields">
  {% for field in form %}
    <div class="field sp-f-{{ field.name }}">
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {% if field.help_text %}<p class="field-help">{{ field.help_text }}</p>{% endif %}
      {% for error in field.errors %}<p class="field-error">{{ error }}</p>{% endfor %}
    </div>
  {% endfor %}
</div>
{% if form.non_field_errors %}<p class="field-error">{{ form.non_field_errors }}</p>{% endif %}
